services:
  lab2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lab2
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: ${ConnectionStrings__DefaultConnection:?set in .env}
      Jwt__Issuer: ${Jwt__Issuer:-PRN232.LMS.API}
      Jwt__Audience: ${Jwt__Audience:-PRN232.LMS.Client}
      Jwt__Secret: ${Jwt__Secret:?set in .env}
      Jwt__AccessTokenMinutes: ${Jwt__AccessTokenMinutes:-60}
      Jwt__RefreshTokenDays: ${Jwt__RefreshTokenDays:-7}
    ports:
      - "${LAB2_API_PORT:-8080}:8080"

  postgres:
    image: postgres:16
    container_name: lab2-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-prn232_lms}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-prn232_lms}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    volumes:
      - lab2_postgres_data:/var/lib/postgresql/data

volumes:
  lab2_postgres_data:
