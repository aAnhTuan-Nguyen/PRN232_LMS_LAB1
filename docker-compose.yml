services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: prn232-lms-api-submit
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=prn232_lms;Username=postgres;Password=postgres
    ports:
      - "8080:8080"

  postgres:
    image: postgres:16
    container_name: prn232-lms-postgres-submit
    environment:
      POSTGRES_DB: prn232_lms
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-prn232_lms}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
